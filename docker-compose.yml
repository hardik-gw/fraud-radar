# The whole stack:  docker compose up --build
#
# Kafka runs in KRaft mode, so there is no ZooKeeper container. That used to be
# mandatory and is the main reason older Kafka tutorials have five services
# instead of two.

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: fraud-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # Advertised as `kafka:9092` because clients connect from inside the
      # compose network. A client on the host would need a second listener.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Single broker, so nothing can be replicated anywhere else.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Don't wait 3 seconds for other consumers that are never coming.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Four partitions: the ceiling on how many consumers can share the work,
      # since each partition is read by exactly one consumer in a group.
      KAFKA_NUM_PARTITIONS: 4
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    container_name: fraud-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: fraud
      POSTGRES_DB: fraud_radar
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud -d fraud_radar"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: fraud-api
    ports:
      - "8000:8000"
    volumes:
      # The model artifact is not baked into the image — it is regenerated by
      # training and would make every rebuild carry a stale copy.
      - ./models:/app/models:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  consumer:
    build: .
    container_name: fraud-consumer
    command: ["python", "-m", "streaming.consumer"]
    environment:
      KAFKA_BROKERS: kafka:9092
      POSTGRES_DSN: postgresql://fraud:fraud@postgres:5432/fraud_radar
    volumes:
      - ./models:/app/models:ro
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  producer:
    build: .
    container_name: fraud-producer
    command: ["python", "-m", "streaming.producer", "--rate", "50"]
    environment:
      KAFKA_BROKERS: kafka:9092
    volumes:
      # The producer replays the dataset, so it needs the data the others don't.
      - ./data:/app/data:ro
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  pgdata:
